<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis — DM Closing System™</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<meta name="theme-color" content="#080a0d"><meta name="color-scheme" content="dark"><link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body data-nav="Analyze">

<nav class="nav" id="site-nav"></nav>

<div class="wrap result-shell" id="result-root">
  <!-- populated by JS; empty-state fallback lives in #empty-fallback -->
</div>

<footer class="footer" id="site-footer"></footer>

<script src="js/partials.js"></script>
<script src="js/engine.js"></script>
<script>
const session = loadAnalysisSession();
const root = document.getElementById('result-root');

if(!session){
  root.innerHTML = `
    <div class="empty-state">
      <h3>Nothing to show yet.</h3>
      <p>Your next conversation starts here — paste one in and get the full diagnosis.</p>
      <a href="analyze.html" class="btn btn--primary mt-24">Analyze a conversation</a>
    </div>`;
} else {
  render(session);
}

function pct(n){ return Math.round(n) + ''; }
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function severityBadge(sev){
  const cls = sev==='high' ? 'badge--red' : sev==='medium' ? 'badge--amber' : 'badge--accent';
  return `<span class="badge ${cls} badge--dot">${sev.toUpperCase()}</span>`;
}

function render(session){
  const a = session.analysis;
  const insufficient = a.conversation_state.state === 'INSUFFICIENT_DATA';

  root.innerHTML = `
    <div class="result-top">
      <a href="analyze.html" class="result-back">← Analyze another conversation</a>
      <span class="badge" style="color:var(--fg-faint)">${esc(session.title || 'Conversation')}</span>
    </div>

    <div class="card state-panel">
      <div class="state-panel__icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 17.5L9 12l3.2 3 5.3-6.5" stroke="#22c98a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="state-panel__label">CONVERSATION STATE™</div>
        <div class="state-panel__state">${a.conversation_state.state.replace(/_/g,' ')}</div>
      </div>
      <div class="state-panel__conf">
        <div class="num">${a.conversation_state.confidence}%</div>
        <div class="lbl">CONFIDENCE</div>
      </div>
    </div>

    ${insufficient ? '' : `
    <div class="card readiness-card">
      <div class="readiness-head">
        <span class="eyebrow" style="color:var(--fg-faint)">CLOSING READINESS</span>
        <div class="readiness-score">${a.closing_readiness.overall_score}<span>/100</span></div>
      </div>
      <div class="dims">
        ${Object.entries(a.closing_readiness.dimensions).map(([k,v]) => `
          <div class="dim-row">
            <span class="dname">${k.replace(/_/g,' ').replace(/^\w/,c=>c.toUpperCase())}</span>
            <span class="meter"><span style="width:${pct(v)}%"></span></span>
            <span class="dval">${pct(v)}</span>
          </div>`).join('')}
      </div>
      <div class="readiness-explain"><p>${esc(a.closing_readiness.explanation)}</p></div>
    </div>`}

    <div class="section-label"><span class="num">01</span><h3>The situation</h3></div>
    <div class="situation"><p>${esc(a.situation || a.conversation_state.evidence.join('. '))}</p></div>

    ${insufficient ? '' : `
    <div class="section-label"><span class="num">02</span><h3>What they're really signaling</h3></div>
    <div class="signals-grid">
      <div>
        <h5 style="font-size:.78rem;color:var(--fg-faint);margin-bottom:12px;">OBSERVED</h5>
        ${a.signals.observed.map(s => `
          <div class="signal-item ${s.type==='positive'?'pos':s.type==='negative'?'neg':''}">
            <span class="stype">${s.type.toUpperCase()}</span>
            <div class="stext">${esc(s.signal)}</div>
            ${s.quote ? `<div class="squote">"${esc(s.quote)}"</div>` : ''}
          </div>`).join('')}
      </div>
      <div>
        <h5 style="font-size:.78rem;color:var(--fg-faint);margin-bottom:12px;">INFERRED</h5>
        ${a.signals.inferred.map(s => `
          <div class="signal-item inf">
            <span class="stype">${s.confidence.toUpperCase()} CONFIDENCE</span>
            <div class="stext">${esc(s.inference)}</div>
            <div class="squote">${esc(s.reasoning)}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="section-label"><span class="num">03</span><h3>Risks</h3></div>
    <div class="card" style="padding:8px 26px;">
      ${a.risks.map(r => `
        <div class="risk-item">
          ${severityBadge(r.severity)}
          <p style="flex:1;">${esc(r.risk)}</p>
        </div>`).join('')}
    </div>`}

    <div class="nextmove">
      <div class="nextmove__eyebrow">THE NEXT MOVE — SINGULAR, NOT A LIST</div>
      <h3>${esc(a.next_move.move)}</h3>
      <div class="nextmove__grid">
        <div class="nextmove__block">
          <h5>OBJECTIVE</h5>
          <p style="color:var(--fg-dim); font-size:.9rem;">${esc(a.next_move.objective)}</p>
        </div>
        <div class="nextmove__block">
          <h5>AVOID</h5>
          <ul>${a.next_move.avoid.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="nextmove__why"><strong style="color:var(--fg)">Why now:</strong> ${esc(a.next_move.why_now)}</div>
    </div>

    ${insufficient ? '' : `
    <div class="section-label"><span class="num">04</span><h3>Response architect</h3></div>
    <div class="resp-tabs" id="resp-tabs">
      ${Object.keys(a.responses).map((k,i) => `<div class="resp-tab ${i===0?'is-active':''}" data-tab="${k}">${k[0].toUpperCase()+k.slice(1)}</div>`).join('')}
    </div>
    <div class="resp-panel-wrap">
      ${Object.entries(a.responses).map(([k,r],i) => `
        <div class="resp-panel ${i===0?'is-active':''}" data-panel="${k}">
          <div class="msg">${esc(r.message)}</div>
          <div class="why"><span style="color:var(--fg-faint)">WHY:</span><span>${esc(r.reasoning)}</span></div>
          <div class="resp-actions"><button class="copy-btn" data-copy="${esc(r.message)}">Copy message</button></div>
        </div>`).join('')}
    </div>

    <div class="section-label"><span class="num">05</span><h3>Don't send this</h3></div>
    <div class="dontsend-block">
      <div class="msg">${esc(a.dont_send.message)}</div>
      <div class="dontsend-why">
        <div><h5>WHY IT'S TEMPTING</h5><p>${esc(a.dont_send.why_tempting)}</p></div>
        <div><h5>WHY IT'S WRONG HERE</h5><p>${esc(a.dont_send.why_wrong)}</p></div>
      </div>
    </div>

    ${a.watch_for.length ? `
    <div class="section-label"><span class="num">06</span><h3>What to watch for</h3></div>
    <div class="card" style="padding:6px 26px;">
      ${a.watch_for.map(w => `
        <div class="watch-item">
          <div><h6>SIGNAL</h6><p>${esc(w.signal)}</p></div>
          <div><h6>MEANING</h6><p>${esc(w.meaning)}</p></div>
          <div><h6>NEXT ACTION</h6><p>${esc(w.next_action)}</p></div>
        </div>`).join('')}
    </div>` : ''}

    <div class="section-label"><span class="num">07</span><h3>Follow-up intelligence</h3></div>
    <div class="card followup-card">
      <div>
        <span class="badge badge--accent mono">${a.follow_up.recommendation.replace(/_/g,' ')}</span>
        <p style="margin-top:12px; max-width:52ch;">${esc(a.follow_up.reasoning)}</p>
      </div>
      <div style="text-align:right;">
        <div class="state-panel__label">SUGGESTED TIMING</div>
        <div class="mono" style="font-size:1.1rem;">${esc(a.follow_up.suggested_timing||'—')}</div>
      </div>
    </div>
    `}

    <div class="result-actions">
      <a href="analyze.html" class="btn btn--primary">Analyze another conversation</a>
      <button class="btn btn--ghost" id="save-conv">Save conversation</button>
    </div>
  `;

  wireInteractions();
}

function wireInteractions(){
  document.querySelectorAll('.resp-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.resp-tab').forEach(t=>t.classList.remove('is-active'));
      document.querySelectorAll('.resp-panel').forEach(p=>p.classList.remove('is-active'));
      tab.classList.add('is-active');
      document.querySelector(`.resp-panel[data-panel="${tab.dataset.tab}"]`).classList.add('is-active');
    });
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const copy = navigator.clipboard ? navigator.clipboard.writeText(btn.dataset.copy) : Promise.resolve((()=>{ const ta=document.createElement('textarea'); ta.value=btn.dataset.copy; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); })());
      copy.then(() => {
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(()=>btn.textContent = old, 1400);
      });
    });
  });

  const saveBtn = document.getElementById('save-conv');
  if(saveBtn){
    saveBtn.addEventListener('click', () => {
      const list = JSON.parse(localStorage.getItem('dmcs_conversations')||'[]');
      list.unshift({ ...session, id: 'c_'+Date.now(), savedAt: new Date().toISOString() });
      localStorage.setItem('dmcs_conversations', JSON.stringify(list.slice(0,30)));
      saveBtn.textContent = 'Saved ✓';
      saveBtn.disabled = true;
    });
  }
}
</script>
</body>
</html>
