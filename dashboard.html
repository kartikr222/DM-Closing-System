<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace — DM Closing System™</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<meta name="theme-color" content="#080a0d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="canonical" href="https://kartikr222.github.io/DM-Closing-System/dashboard.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Workspace — DM Closing System™">
<meta property="og:description" content="Your saved conversation diagnoses, in one workspace.">
<meta property="og:image" content="https://kartikr222.github.io/DM-Closing-System/assets/og-image.jpg">
<meta property="og:url" content="https://kartikr222.github.io/DM-Closing-System/dashboard.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Workspace — DM Closing System™">
<meta name="twitter:description" content="Your saved conversation diagnoses, in one workspace.">
<meta name="twitter:image" content="https://kartikr222.github.io/DM-Closing-System/assets/og-image.jpg">
</head>
<body data-nav="Workspace">

<nav class="nav" id="site-nav"></nav>

<div class="wrap dash-shell">
  <div class="dash-head">
    <div>
      <span class="eyebrow">WORKSPACE</span>
      <h1 class="mt-12" style="font-size:2rem;">Conversations</h1>
    </div>
    <a href="analyze.html" class="btn btn--primary">Analyze new</a>
  </div>

  <div class="conv-list" id="conv-list"></div>

  <div id="followups-wrap" style="margin-top:64px;"></div>
</div>

<footer class="footer" id="site-footer"></footer>

<script src="js/partials.js"></script>
<script src="js/engine.js"></script>
<script>
function stateColor(state){
  if(['DISENGAGING','STALLING'].includes(state)) return 'badge--red';
  if(['HESITATING','OBJECTION'].includes(state)) return 'badge--amber';
  return 'badge--accent';
}

function getConversations(){
  const list = JSON.parse(localStorage.getItem('dmcs_conversations')||'[]');
  return list;
}

function renderList(){
  const wrap = document.getElementById('conv-list');
  const list = getConversations();

  if(list.length===0){
    wrap.innerHTML = `
      <div class="empty-state card">
        <h3>Your next conversation starts here.</h3>
        <p>Analyses you save will show up here with their state, readiness, and next move — so you always know exactly where each thread stands.</p>
        <a href="analyze.html" class="btn btn--primary mt-24">Analyze a conversation</a>
      </div>`;
    renderFollowUps([]);
    return;
  }

  wrap.innerHTML = list.map(c => `
    <a class="card conv-card" href="javascript:void(0)" data-id="${c.id}">
      <div class="conv-card__meta">
        <div class="conv-card__title">${esc(c.title||'Conversation')}</div>
        <div class="conv-card__preview">${esc((c.analysis.next_move && c.analysis.next_move.move) || '')}</div>
      </div>
      <div class="conv-card__right">
        <span class="badge ${stateColor(c.analysis.conversation_state.state)}">${c.analysis.conversation_state.state.replace(/_/g,' ')}</span>
        <div class="conv-card__score">
          <div class="n">${c.analysis.closing_readiness ? c.analysis.closing_readiness.overall_score : '—'}</div>
          <div class="l">READY</div>
        </div>
      </div>
    </a>`).join('');

  wrap.querySelectorAll('.conv-card').forEach(el => {
    el.addEventListener('click', () => {
      const c = list.find(x=>x.id===el.dataset.id);
      saveAnalysisSession(c);
      window.location.href = 'result.html';
    });
  });

  renderFollowUps(list);
}

function renderFollowUps(list){
  const wrap = document.getElementById('followups-wrap');
  const needing = list.filter(c => c.analysis.follow_up && ['WAIT','REOPEN','CHANGE_ANGLE'].includes(c.analysis.follow_up.recommendation));

  wrap.innerHTML = `
    <div class="section-label" style="margin-top:0;"><h3>Follow-up intelligence</h3></div>
    ${needing.length===0 ? `<p style="color:var(--fg-faint); font-size:.9rem;">Nothing needs a follow-up call right now — saved conversations that are waiting on a reply will show up here.</p>` : ''}
    ${needing.map(c => `
      <div class="card followup-card" style="margin-bottom:12px;">
        <div>
          <div style="font-weight:600; margin-bottom:6px;">${esc(c.title)}</div>
          <span class="badge ${stateColor(c.analysis.conversation_state.state)}">${c.analysis.follow_up.recommendation.replace(/_/g,' ')}</span>
        </div>
        <p style="max-width:44ch; flex:1;">${esc(c.analysis.follow_up.reasoning)}</p>
      </div>`).join('')}
  `;
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

renderList();
</script>
</body>
</html>
