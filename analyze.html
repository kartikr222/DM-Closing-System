<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyze a conversation — DM Closing System™</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<meta name="theme-color" content="#080a0d"><meta name="color-scheme" content="dark"><link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body data-nav="Analyze">

<nav class="nav" id="site-nav"></nav>

<div class="wrap analyze-shell">
  <span class="eyebrow">STEP 1 OF 1</span>
  <h1 class="mt-12">Analyze a conversation</h1>
  <p class="lede mt-12">Paste the real thread. The system reads the evidence, separates observation from inference, and gives you one next move.</p>

  <form id="analyze-form">
    <div class="field">
      <label for="conv-text">Conversation</label>
      <textarea id="conv-text" placeholder="Prospect: Hey, saw your post about...&#10;You: What are you mainly using it for right now?&#10;..." required></textarea>
      <div class="hint">Don't have one handy? <span class="sample-link" id="load-sample">Load the sample conversation</span> to see a full diagnosis.</div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="context">What are you selling? <span style="color:var(--fg-faint); font-weight:400;">(optional)</span></label>
        <input type="text" id="context" placeholder="e.g. CRM migration service">
      </div>
      <div class="field">
        <label for="outcome">What outcome do you want?</label>
        <select id="outcome">
          <option>Not sure</option>
          <option>Start conversation</option>
          <option>Qualify</option>
          <option>Book a call</option>
          <option>Handle an objection</option>
          <option>Re-engage</option>
          <option>Close</option>
        </select>
      </div>
    </div>

    <div class="analyze-footer">
      <span class="charcount" id="charcount">0 characters</span>
      <button type="submit" class="btn btn--primary btn--lg">Analyze conversation →</button>
    </div>
  </form>
</div>

<footer class="footer" id="site-footer"></footer>

<div class="loading-mask" id="loading-mask">
  <div class="loading-box">
    <div class="pulse-ring"></div>
    <div class="loading-line" id="loading-line">Reading the conversation…</div>
  </div>
</div>

<script src="js/partials.js"></script>
<script src="js/engine.js"></script>
<script>
const textEl = document.getElementById('conv-text');
const countEl = document.getElementById('charcount');
textEl.addEventListener('input', () => { countEl.textContent = textEl.value.length + ' characters'; });

document.getElementById('load-sample').addEventListener('click', () => {
  textEl.value = DEMO_CONVERSATION.raw_text;
  document.getElementById('context').value = 'CRM migration service';
  document.getElementById('outcome').value = 'Qualify';
  countEl.textContent = textEl.value.length + ' characters';
});

const stages = [
  'Reading the conversation…',
  'Mapping conversation state…',
  'Scoring closing readiness…',
  'Weighing risks…',
  'Selecting the one next move…',
];

document.getElementById('analyze-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const rawText = textEl.value.trim();
  if(rawText.split(/\s+/).filter(Boolean).length < 8){ textEl.focus(); textEl.setCustomValidity('Paste at least a few real messages for a useful diagnosis.'); textEl.reportValidity(); return; }
  textEl.setCustomValidity('');
  const context = document.getElementById('context').value.trim();
  const outcome = document.getElementById('outcome').value;

  const mask = document.getElementById('loading-mask');
  const line = document.getElementById('loading-line');
  mask.classList.add('is-active');

  let i = 0;
  const iv = setInterval(() => {
    i++;
    if(i < stages.length){ line.textContent = stages[i]; }
  }, 480);

  setTimeout(() => {
    clearInterval(iv);
    // If they loaded the exact sample, use the hand-authored demo analysis.
    // Otherwise run the heuristic engine over what they pasted.
    const isSample = rawText === DEMO_CONVERSATION.raw_text.trim();
    const analysis = isSample ? DEMO_CONVERSATION.analysis : runHeuristicEngine(rawText, context, outcome);
    saveAnalysisSession({ rawText, context, outcome, analysis, title: isSample ? DEMO_CONVERSATION.title : deriveTitle(rawText, context) });
    window.location.href = 'result.html';
  }, 480 * stages.length + 200);
});

function deriveTitle(text, context){
  if(context) return context.slice(0,1).toUpperCase()+context.slice(1) + ' conversation';
  const firstLine = text.split('\n').find(Boolean) || 'Conversation';
  return firstLine.replace(/^\w+:\s*/,'').slice(0,42) + (firstLine.length>42?'…':'');
}
</script>
</body>
</html>
